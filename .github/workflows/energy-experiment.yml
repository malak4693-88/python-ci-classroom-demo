
name: Green CI Energy Experiment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose experiment"
        required: true
        type: choice
        options:
          - baseline
          - duplicate-tests

permissions:
  contents: read
  actions: read

jobs:
  energy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Start energy measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
          send-data: false

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Measure setup
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: setup


      - name: Run normal tests and workload
        run: |
          python -m pytest -q
          python - <<'PY'
          import hashlib
          import time

          end = time.monotonic() + 20
          data = b"green-software-experiment"

          while time.monotonic() < end:
              data = hashlib.sha256(data).digest()

          print("CPU workload completed")
          PY


      - name: Measure normal tests
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: normal-tests


      - name: Run redundant tests
        if: inputs.mode == 'duplicate-tests'
        run: |
          python -m pytest -q
          python - <<'PY'
          import hashlib
          import time

          end = time.monotonic() + 20
          data = b"green-software-experiment"

          while time.monotonic() < end:
              data = hashlib.sha256(data).digest()

          print("Redundant CPU workload completed")
          PY


      - name: Measure redundant tests
        if: inputs.mode == 'duplicate-tests'
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: redundant-tests

      - name: Show energy results
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: display-results
